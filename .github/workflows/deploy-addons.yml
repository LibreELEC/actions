name: "Deploy: Addons"
on:
  workflow_dispatch:
    inputs:
      release:
        description: "LE release to deploy addons for"
        required: true
        type: choice
        default: "LE 13"
        options:
          - "LE 10"
          - "LE 11"
          - "LE 12"
          - "LE 12.2"
          - "LE 13"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update_addon_repo:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: "${{ github.repository_owner }}/actions"
          path: "actions"

      - name: Determine addon version
        id: version
        run: |
          case "${{ github.event.inputs.release }}" in
            "LE 10")   branch="libreelec-10.0" ;;
            "LE 11")   branch="libreelec-11.0" ;;
            "LE 12")   branch="libreelec-12.0" ;;
            "LE 12.2") branch="libreelec-12.2" ;;
            "LE 13")   branch="master" ;;
          esac
          addon_version=$(curl -s "https://raw.githubusercontent.com/LibreELEC/LibreELEC.tv/${branch}/distributions/LibreELEC/version" \
            | grep -oP 'ADDON_VERSION="\K[^"]+')
          echo "addon_version=${addon_version}" >> "${GITHUB_OUTPUT}"

      - name: Update Add-on repository
        id: result
        run: |
          output=$(ssh ${{ secrets.ADDONS_HOST_USERNAME }}@${{ secrets.ADDONS_HOST }} \
            -p ${{ secrets.ADDONS_HOST_PORT }} \
            "bash -s" < ./actions/scripts/update_addon_repo.sh \
            "${{ steps.version.outputs.addon_version }}" || true)
          [ -z "${output}" ] && exit 0
          {
            echo "json<<EOF"
            echo "${output}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Format Slack messages
        id: fmt
        if: steps.result.outputs.json != ''
        env:
          RESULT_JSON: ${{ steps.result.outputs.json }}
        run: |
          python3 - << 'PYEOF'
          import json, os

          data = json.loads(os.environ.get('RESULT_JSON', '{}'))
          version = data.get('version', '')
          warnings = data.get('warnings', [])
          architectures = data.get('architectures', [])
          error = data.get('error', '')
          out = os.environ['GITHUB_OUTPUT']

          has_warnings = bool(error or warnings)
          has_updates = bool(architectures)

          def header(text):
            return {'type': 'header', 'text': {'type': 'plain_text', 'text': text, 'emoji': True}}

          # Slack rejects a section with more than 3000 characters of text,
          # so split long lists at line breaks into several sections.
          def sections(lines, limit=3000):
            chunks = [[]]
            size = 0
            for line in lines:
              if chunks[-1] and size + 1 + len(line) > limit:
                chunks.append([])
                size = 0
              chunks[-1].append(line[:limit])
              size += len(line) + 1
            return [{'type': 'section', 'text': {'type': 'mrkdwn', 'text': '\n'.join(c)}}
                    for c in chunks]

          warning_parts = []
          if error:
            warning_parts.append(f'*ERROR*: {error}')
          if warnings:
            warning_parts.append(f'*WARNING* wrong checksums ({len(warnings)} files):')
            warning_parts.extend(f'  {w}' for w in warnings)
          warnings_blocks = [header(':warning: Warnings')] + sections(warning_parts)

          updates_blocks = [header(':large_green_circle: Updated Add-ons')]
          for arch in architectures:
            label = arch.get('label', '')
            addons = arch.get('addons', [])
            lines = [f'*Updated Add-ons - {label} ({version})*'] + [f' {a}' for a in addons]
            updates_blocks += sections(lines)

          with open(out, 'a') as f:
            f.write(f'has_warnings={"true" if has_warnings else "false"}\n')
            f.write(f'has_updates={"true" if has_updates else "false"}\n')
            if has_warnings:
              f.write(f'warnings_blocks={json.dumps(warnings_blocks)}\n')
            if has_updates:
              f.write(f'updates_blocks={json.dumps(updates_blocks)}\n')
          PYEOF

      - name: Notify warnings
        if: steps.fmt.outputs.has_warnings == 'true'
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.ADDONS_REPO_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            username: "ADDON Bot"
            icon_emoji: ":ghost:"
            channel: "${{ secrets.ADDONS_REPO_WEBHOOK_CHANNEL }}"
            blocks: ${{ steps.fmt.outputs.warnings_blocks }}

      - name: Notify updates
        if: steps.fmt.outputs.has_updates == 'true'
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.ADDONS_REPO_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            username: "ADDON Bot"
            icon_emoji: ":ghost:"
            channel: "${{ secrets.ADDONS_REPO_WEBHOOK_CHANNEL }}"
            blocks: ${{ steps.fmt.outputs.updates_blocks }}
